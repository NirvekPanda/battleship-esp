# nginx serving the relay dashboard and the game page.
#
#   make -C server dashboard        from the repo
#   nginx -p dashboard/ -c dashboard/nginx.conf
#
# nginx serves the static files and proxies /v1 to the relay, so same-origin
# requests need no CORS at all. The CORS block below is for the case that is
# coming: reached through a Cloudflare tunnel at battleship.nirvek.xyz and
# game.nirvek.xyz, where the page and the API may not share an origin.
#
# Deploying on Proxmox as a service: this file is self-contained apart from
# the paths in `-p`, so it works unmodified on Debian. See the systemd note at
# the bottom.

worker_processes 1;
daemon off;                 # foreground, so Ctrl-C and systemd both work
error_log /dev/stderr warn;
pid nginx.pid;

events {
    worker_connections 256;
}

http {
    # Relative to -p. Shipped with the repo because the system copy is in a
    # different place on every platform.
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    client_body_temp_path tmp/body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    # Which origins may call the API from a page nginx did not serve.
    #
    # An allow-list, not "*": the API is called with an X-Peer-Token, and a
    # wildcard origin cannot be combined with credentials at all. Anything not
    # named here gets an empty value, which nginx omits entirely -- so the
    # browser blocks it, which is the intended answer for an unknown origin.
    # https only for the tunnelled names: Cloudflare terminates TLS, so a real
    # page is never served over plain http there. Trusting the http origin
    # would only ever help someone able to spoof DNS or intercept plain http
    # for that name.
    map $http_origin $cors_origin {
        default                             "";
        "https://battleship.nirvek.xyz"     $http_origin;
        "https://dashship.nirvek.xyz"       $http_origin;
        "https://game.nirvek.xyz"           $http_origin;
        "http://localhost:8081"             $http_origin;
        "http://localhost:8080"             $http_origin;
        "http://127.0.0.1:8081"             $http_origin;
        # The house WiFi. A phone opening the page by the laptop's LAN address
        # is a different origin from localhost, so without this the dashboard
        # and the game page work on the machine running them and nowhere else.
        # A regex rather than a list because the last octet is whoever's turn
        # it is on the DHCP pool -- still a /24, not a wildcard.
        "~^http://192\.168\.86\.\d{1,3}(:\d+)?$"  $http_origin;
    }

    upstream relay {
        server 127.0.0.1:8080;
        keepalive 8;
        # Below the relay's own IdleTimeout (60s, server/main.go). Equal
        # timeouts on both ends is the classic recipe for intermittent 502s:
        # nginx takes a pooled connection out of the idle list in the same
        # instant Go sends its FIN, and writes into a closing socket.
        keepalive_timeout 30s;
        keepalive_requests 200;
    }

    server {
        # Loopback only. cloudflared connects from this host, so nothing else
        # needs to reach nginx directly -- and binding wider publishes the
        # dashboard, and the whole /v1 API behind it, to the LAN and to any
        # public interface the host happens to have. It is also what makes the
        # set_real_ip_from trust boundary below actually mean something.
        listen      127.0.0.1:8081;
        listen      [::1]:8081;
        server_name localhost battleship.nirvek.xyz game.nirvek.xyz;
        root        .;
        index       index.html;

        # Behind a Cloudflare tunnel the connection arrives from cloudflared on
        # this host, so the client address is only in a header. Trusting that
        # header from ANY source would let anyone claim any address, so it is
        # trusted from the loopback the tunnel runs on and nowhere else.
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header   CF-Connecting-IP;

        # The dashboard is edited while it runs.
        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ =404;
        }

        # Everything the dashboard and the game page ask of the relay.
        location /v1/ {
            # Preflight. Answered here rather than passed upstream: the relay
            # has no OPTIONS handler and would return 405, which a browser
            # reads as "denied" without ever making the real request.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Vary                             "Origin" always;
                add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "X-Peer-Token, X-Admin-Token, Content-Type" always;
                add_header Access-Control-Max-Age           86400 always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin      $cors_origin always;
            # The response differs by request Origin, and Cloudflare's edge sits
            # directly in front. Without this it keys on the URL alone and will
            # hand one origin's Allow-Origin to another -- blocking a legitimate
            # caller, or serving a trusted header to an origin never listed.
            add_header Vary                             "Origin" always;
            # Without this the browser can read the status but not the header,
            # and the board's poll cursor lives in X-Next.
            add_header Access-Control-Expose-Headers    "X-Next" always;
            # A match export must never come from the edge cache: .csv is on
            # Cloudflare's default cached-extension list, and a stale export
            # looks exactly like a fresh one.
            add_header Cache-Control                    "no-store" always;

            proxy_pass http://relay;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # /v1/recv parks for up to 25 seconds. Buffering would hold the
            # reply back until it filled, which defeats a long poll entirely,
            # and a short read timeout would cut the connection before the
            # relay ever answered.
            proxy_buffering off;
            proxy_read_timeout 90s;
        }

        location /healthz {
            proxy_pass http://relay;
            # Same pool, so it needs the same two lines, or it silently opens a
            # fresh connection each time instead of using the one it was
            # pointed at.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

# Running as a service on Proxmox (Debian):
#
#   /etc/systemd/system/battleship-dash.service
#     [Unit]
#     Description=battleship relay dashboard (nginx)
#     After=network.target battleship-relay.service
#     [Service]
#     ExecStart=/usr/sbin/nginx -p /srv/battleship/dashboard \
#                               -c /srv/battleship/dashboard/nginx.conf
#     Restart=on-failure
#     [Install]
#     WantedBy=multi-user.target
#
# `daemon off` above is what lets systemd supervise it directly rather than
# losing track of a process that forks away from it.
