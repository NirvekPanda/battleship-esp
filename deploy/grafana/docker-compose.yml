# Grafana, pointed at the relay.
#
#   cd deploy/grafana && docker compose up -d      ->  http://localhost:8092
#                                                  ->  https://dashship.nirvek.xyz/grafana
#
# No arguments: run.sh writes RELAY, ADMIN_TOKEN and GRAFANA_PORT into .env
# beside this file every time it starts, so the token is never copied by hand.
#
# One plugin does the work: Infinity reads the relay's JSON straight from its
# HTTP endpoints -- no exporter, no database. Everything else is stock Grafana.
services:
  grafana:
    image: grafana/grafana:12.4.10
    container_name: battleship-grafana
    restart: unless-stopped
    ports:
      # 8092 on the host, beside the game on 8090 and the dashboard on 8091.
      - "${GRAFANA_PORT:-8092}:3000"
    environment:
      # Pinned.  Unversioned, Grafana installs the newest build,
      # which is how this broke before: Infinity 4.x imports react/jsx-runtime
      # and only Grafana >=11.6.11 hands that to a plugin, so an 11.3 image
      # answered the import with a 404 and the datasource failed to load.
      # Infinity 4.0.0 needs >=12.2.5, which the image above satisfies. Move
      # the two together or not at all.
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource 4.0.0"
      # The relay and its admin token, read by the provisioned datasource.
      RELAY_URL: "${RELAY:-http://host.docker.internal:8090}"
      RELAY_ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # A lobby list changes in seconds, not minutes, so the dashboard has to
      # be allowed to ask that often.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      # Served under a path, not at a host root: dashship.nirvek.xyz/grafana.
      # Grafana builds every asset and redirect URL from root_url, so without
      # these two the page loads and then asks for /public/... at the top of
      # the host, gets the dashboard's index.html back, and renders nothing.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://dashship.nirvek.xyz/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # /grafana lands on the Battleship dashboard rather than on an empty
      # home page with a link to it.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/battleship.json"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
