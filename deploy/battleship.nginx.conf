# The two public names, in front of the relay.
#
# Installed by `sudo ./run.sh --nginx`, which substitutes the hostnames and
# ports. This is a SITE file for a system nginx (/etc/nginx/sites-available),
# unlike dashboard/nginx.conf, which is a self-contained config for running
# nginx out of the repo during development.
#
# The upstream host below is where the relay actually listens -- 127.0.0.1 when nginx and
# the relay share a machine, and the server's LAN address (RELAY_HOST=... when
# running --nginx) when nginx is in a different container. Proxying to
# 127.0.0.1 from a container the relay is not in is the usual cause of a 502.
#
# The relay serves both the game page and the dashboard itself, so nginx is
# only a front door: TLS and the names are terminated here (or at a Cloudflare
# tunnel in front of here) and everything else is proxied straight through.

# Which origins may call the API from a page nginx did not serve.
#
# An allow-list, not "*": the API is called with an X-Peer-Token, and a
# wildcard origin cannot be combined with credentials at all. Anything not
# named here gets an empty value, which nginx omits entirely -- so the browser
# blocks it, which is the intended answer for an unknown origin.
map $http_origin $battleship_cors {
    default                        "";
    "https://@GAME_HOST@"          $http_origin;
    "https://@DASH_HOST@"          $http_origin;
    "http://@GAME_HOST@"           $http_origin;
    "http://@DASH_HOST@"           $http_origin;
    # The server itself, by address and by port -- named explicitly because
    # this is the one origin that gets typed into a browser by hand while a
    # tunnel is being set up. The 192.168.86.x line below already covers it;
    # these are here so the address is greppable.
    "http://@SERVER_IP@:@PORT@"       $http_origin;
    "http://@SERVER_IP@:@DASH_PORT@"  $http_origin;
    "http://@SERVER_IP@"              $http_origin;
    # The house WiFi and the machine itself, for a phone or a laptop opening
    # the page by address while the tunnel is not in the way.
    "~^http://192\.168\.86\.\d{1,3}(:\d+)?$"  $http_origin;
    "~^http://localhost(:\d+)?$"              $http_origin;
}

# Websocket-style upgrades are not used, but a proxy that does not pass these
# through is a proxy that breaks the first thing that needs them.
map $http_upgrade $battleship_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name @GAME_HOST@;

    # The game page, and the API on the same origin behind it.
    location / {
        proxy_pass http://@UPSTREAM@:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $battleship_upgrade;
        # /v1/recv parks for up to 25 seconds waiting for the opponent to
        # move. A read timeout shorter than that turns every quiet moment in
        # a match into a 504.
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location /v1/ {
        # Preflight, answered here: the relay has no OPTIONS handler and would
        # return 405, which a browser reads as a denial without ever making
        # the real request.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $battleship_cors always;
            add_header Vary                             "Origin" always;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "X-Peer-Token, X-Admin-Token, X-Player-Id, Content-Type" always;
            add_header Access-Control-Max-Age           600 always;
            add_header Content-Length                   0;
            return 204;
        }
        add_header Access-Control-Allow-Origin      $battleship_cors always;
        add_header Vary                             "Origin" always;
        # X-Next carries the poll cursor and X-Lobby-Version the lobby's, and
        # a client that cannot read them re-reads the whole log every second.
        add_header Access-Control-Expose-Headers    "X-Next, X-Lobby-Version" always;

        proxy_pass http://@UPSTREAM@:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name @DASH_HOST@;

    # The dashboard, which the relay serves on its own port.
    location / {
        proxy_pass http://@UPSTREAM@:@DASH_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    # Its API calls go to the RELAY, not to the dashboard port: the dashboard
    # is static files, and /v1 belongs to the game.
    location /v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $battleship_cors always;
            add_header Vary                             "Origin" always;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "X-Peer-Token, X-Admin-Token, X-Player-Id, Content-Type" always;
            add_header Access-Control-Max-Age           600 always;
            add_header Content-Length                   0;
            return 204;
        }
        add_header Access-Control-Allow-Origin      $battleship_cors always;
        add_header Vary                             "Origin" always;
        add_header Access-Control-Expose-Headers    "X-Next, X-Lobby-Version" always;

        proxy_pass http://@UPSTREAM@:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
