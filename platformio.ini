[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial defaults to UART0 (GPIO20/21); route it to the native USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:esp32-c3-devkitm-1]
; src/host/ is the WASM-only backend (see Makefile); never build it here.
build_src_filter = +<*> -<host/>
