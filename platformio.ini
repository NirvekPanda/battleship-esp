[env]
; WEMOS LOLIN32 Lite ("ESP32 Lite V1.0.0" silkscreen): ESP32-D0WD (Xtensa
; LX6, dual core), 4MB flash, no PSRAM, CH340/CP2102 USB-UART bridge.
;
; This is NOT the C3 the project started on, and the difference is not
; cosmetic: the pin map in include/config.h had to be rebuilt around the
; classic part's flash pins (GPIO6-11), its UART0 pins (GPIO1/3) and its
; strapping pins. See the comments there before moving anything.
platform = espressif32
board = lolin32_lite
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Decode the backtrace addresses the panic handler prints into file:line.
monitor_filters = esp32_exception_decoder, time
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:lolin32_lite]
; src/host/ is the WASM-only backend (see Makefile); never build it here.
build_src_filter = +<*> -<host/>
